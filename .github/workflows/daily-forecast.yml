name: Daily forecast

on:
  schedule:
    # Just after local midnight, then two backups. GitHub often starts
    # a cron late or skips it, so a later run covers a missed one.
    # A scheduled run that finds this Pacific date already published
    # exits without rebuilding. workflow_dispatch always rebuilds.
    # 08:15 UTC is 12:15 AM PST and 1:15 AM PDT.
    - cron: "15 8 * * *"
    # 10:15 UTC is 2:15 AM PST and 3:15 AM PDT.
    - cron: "15 10 * * *"
    # 12:15 UTC is 4:15 AM PST and 5:15 AM PDT.
    - cron: "15 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Skip a scheduled run when today is already published
        id: gate
        run: python3 scripts/forecast_schedule.py

      - name: Set up Python
        if: steps.gate.outputs.publish == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the forecast page
        if: steps.gate.outputs.publish == 'true'
        run: python scripts/build_site.py

      - name: Commit the forecast history
        if: steps.gate.outputs.publish == 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.csv data/history.jsonl data/latest.json site/index.html site/latest.json site/version.json
          if git diff --cached --quiet; then
            echo "No forecast changes to commit."
          else
            git commit -m "Update Madrona Beach tide forecast"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Configure GitHub Pages
        if: steps.gate.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - name: Upload the page
        if: steps.gate.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
